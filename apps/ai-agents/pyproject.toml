[project]
name = "joola-ai-agents"
version = "0.1.0"
description = "JOOLA CS — 7-agent LangGraph pipeline service (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "JOOLA CS Platform" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "supabase>=2.5.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "warranty-policy",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.8.0",
  "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
warranty-policy = { path = "../../packages/warranty-policy", editable = true }

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
